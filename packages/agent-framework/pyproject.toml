[project]
name = "atlas-pca-agent-framework"
version = "0.3.0"
description = "Microsoft Agent Framework tool guard for Atlas Proof-Carrying Authority (PCA): make every tool/function call proof-carrying and policy-gated"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atlas" }]
keywords = ["authorization", "agents", "proof-carrying-authority", "pca", "agent-framework"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = ["atlas-pca>=0.3.0,<0.4"]  # the reference PCActn verifier; no crypto is reimplemented here

[project.optional-dependencies]
test-real = ["pytest>=7", "agent-framework-core==1.21.0", "pytest-asyncio"]  # pinned framework versions the end-to-end tests are validated against (see Makefile / sdks/scripts/test-adapters-real.sh)
agent-framework = ["agent-framework>=1.0"]  # optional: real AIFunction / FunctionMiddleware. The guard is duck-typed, so tests need no install.
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Atlas-Authorization/pca-python"
Repository = "https://github.com/Atlas-Authorization/pca-python"
Issues = "https://github.com/Atlas-Authorization/pca-python/issues"
Specification = "https://github.com/Atlas-Authorization/pca"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_pca_agent_framework"]
