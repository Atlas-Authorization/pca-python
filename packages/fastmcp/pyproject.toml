[project]
name = "atlas-pca-fastmcp"
version = "0.1.0"
description = "Per-tool Proof-Carrying Authority enforcement for FastMCP (verify a PCActn on every tools/call)"
requires-python = ">=3.9"
dependencies = ["atlas-pca>=0.1"]  # the shared reference verifier; this package adds no crypto

[project.optional-dependencies]
fastmcp = ["fastmcp>=2.3"]        # optional: the FastMCP middleware base + ToolError; logic stays importable without it
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_pca_fastmcp"]
