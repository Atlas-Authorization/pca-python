[project]
name = "atlas-pca-google-adk"
version = "0.1.0"
description = "Google ADK (Gemini/Vertex Agent Development Kit) tool guard for Atlas Proof-Carrying Authority (PCA): make every ADK tool call proof-carrying and policy-gated"
requires-python = ">=3.9"
dependencies = ["atlas-pca>=0.1.0"]  # the reference PCActn verifier; no crypto is reimplemented here

[project.optional-dependencies]
adk = ["google-adk>=0.1"]  # optional: real FunctionTool objects. The guard is duck-typed, so tests need no install.
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_pca_google_adk"]
