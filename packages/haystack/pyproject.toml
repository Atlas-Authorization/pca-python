[project]
name = "atlas-pca-haystack"
version = "0.3.0"
description = "Haystack (deepset) tool guard for Atlas Proof-Carrying Authority (PCA): make every Haystack tool/ToolInvoker call proof-carrying and policy-gated"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atlas" }]
keywords = ["authorization", "agents", "proof-carrying-authority", "pca", "haystack"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = ["atlas-pca>=0.3.0,<0.4"]  # the reference PCActn verifier; no crypto is reimplemented here

[project.optional-dependencies]
test-real = ["pytest>=7", "haystack-ai==3.3.0", "pytest-asyncio"]  # pinned framework versions the end-to-end tests are validated against (see Makefile / sdks/scripts/test-adapters-real.sh)
haystack = ["haystack-ai>=2.0"]  # optional: real Tool objects. The guard is duck-typed, so tests need no install.

[project.urls]
Homepage = "https://github.com/Atlas-Authorization/pca-python"
Repository = "https://github.com/Atlas-Authorization/pca-python"
Issues = "https://github.com/Atlas-Authorization/pca-python/issues"
Specification = "https://github.com/Atlas-Authorization/pca"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_pca_haystack"]
