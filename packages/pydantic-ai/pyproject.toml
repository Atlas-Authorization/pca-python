[project]
name = "atlas-pca-pydantic-ai"
version = "0.3.0"
description = "Proof-Carrying Authority tool guard for Pydantic AI (verify a PCActn before each tool runs)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atlas" }]
keywords = ["authorization", "agents", "proof-carrying-authority", "pca", "pydantic-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = ["atlas-pca>=0.3.0,<0.4"]  # the shared reference verifier; this package adds no crypto

[project.optional-dependencies]
test-real = ["pytest>=7", "pydantic-ai-slim==2.54.0", "pytest-asyncio"]  # pinned framework versions the end-to-end tests are validated against (see Makefile / sdks/scripts/test-adapters-real.sh)
pydantic-ai = ["pydantic-ai>=0.0.14"]  # optional: ModelRetry/RunContext/Tool; logic stays importable without it
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Atlas-Authorization/pca-python"
Repository = "https://github.com/Atlas-Authorization/pca-python"
Issues = "https://github.com/Atlas-Authorization/pca-python/issues"
Specification = "https://github.com/Atlas-Authorization/pca"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_pca_pydantic_ai"]
