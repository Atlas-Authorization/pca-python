[project]
name = "atlas-pca-crewai"
version = "0.2.0"
description = "CrewAI tool guard for Atlas Proof-Carrying Authority (PCA): make every CrewAI tool call proof-carrying and policy-gated"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atlas" }]
keywords = ["authorization", "agents", "proof-carrying-authority", "pca", "crewai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = ["atlas-pca>=0.2.0,<0.3"]  # the reference PCActn verifier; no crypto is reimplemented here

[project.optional-dependencies]
crewai = ["crewai>=0.70"]  # optional: real BaseTool subclasses. The guard is duck-typed, so tests need no install.

[project.urls]
Homepage = "https://github.com/Atlas-Authorization/pca-python"
Repository = "https://github.com/Atlas-Authorization/pca-python"
Issues = "https://github.com/Atlas-Authorization/pca-python/issues"
Specification = "https://github.com/Atlas-Authorization/pca"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_pca_crewai"]
