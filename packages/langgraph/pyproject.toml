[project]
name = "atlas-pca-langgraph"
version = "0.1.0"
description = "LangGraph tool/node guard for Atlas Proof-Carrying Authority (PCA): make every graph tool/node call proof-carrying and policy-gated, with interrupt()-based step-up for risky nodes"
requires-python = ">=3.9"
dependencies = ["atlas-pca>=0.1.0"]  # the reference PCActn verifier; no crypto is reimplemented here

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]  # optional: real ToolNode/ToolMessage/interrupt. The guard is duck-typed, so tests need no install.
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_pca_langgraph"]
