name: CI

# The atlas-pca verifier (repo root) + the framework adapters (packages/<framework>): unit tests and the shared
# conformance corpus (conformance/vectors.json, run by test_conformance.py).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: verifier (${{ matrix.os }}, py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'  # test_base_pinned.py: set order must be the same in CI and in the mutation job
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          # requires-python >=3.9: setup-python has no 3.9 build for ubuntu-latest (26.04), so 3.9 runs on 24.04
          - { os: ubuntu-24.04, python: '3.9' }
          - { os: windows-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Full adversarial corpus from the flagship
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --layout $([ "$RUNNER_OS" = Windows ] || echo --less)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RSA DPoP oracle corpus (generated, never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$PWD/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated, never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$PWD/test-data" oprf:oprf core-frost-java:core-frost-java mpc-ot:mpc-ot attest-eat:attest-eat abe:abe frost-dkg:frost-dkg
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: libsodium (ristretto255 backend of the ratchet and OPRF)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libsodium-dev; elif [ "$RUNNER_OS" = macOS ]; then brew install libsodium; fi
      - name: Install (package + optional backends + test deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fast,pq,fastapi,django,flask,ristretto,yaml]" pytest pytest-xdist pytest-timeout httpx
      - name: Conformance corpus
        run: python test_conformance.py
      # the action-kit shared vectors (conformance/actions: ActionDef parse, canonical digest, trait expansion, rule 22, pack proofs,
      # ActionSchema v2): a missing directory FAILS, it is never skipped
      - name: actions-vectors
        run: |
          test -s conformance/actions/pack-builtin.json
          python -m unittest test_actions_vectors
      - name: Decision vectors (units, tighten-only, decision lattice, multi-check fold, escalation answers under every suite, rules 20-21 end to end)
        run: |
          test -s conformance/decision-vectors.json || test -s packages/pca/conformance/decision-vectors.json
          test -s conformance/model-rules-vectors.json || test -s packages/pca/conformance/model-rules-vectors.json
          python -m pytest -q test_decision_conformance.py test_escalation_guard.py test_model_rules.py
      - name: Caveat language v2 vectors (discharges, narrow, max_uses, derive, spiffe_bound, K1 evaluation)
        run: |
          test -s conformance/caveat-lang-vectors.json || test -s packages/pca/conformance/caveat-lang-vectors.json
          python -m pytest -q test_caveat_lang.py test_k1_authorize.py
      - name: Forbid-wins certificate and linked policy template vectors (a missing file fails, never skips)
        run: |
          test -s conformance/forbid-certificate-vectors.json || test -s packages/pca/conformance/forbid-certificate-vectors.json
          test -s conformance/policy-link-vectors.json || test -s packages/pca/conformance/policy-link-vectors.json
          python -m pytest -q test_forbid_certificate.py test_policy_link.py
      - name: K3 operational-plane artifacts and the fresh_at PCActn member (shared k3-vectors.json and fresh-at-vectors.json; a missing file fails, never skips)
        run: |
          test -s conformance/k3-vectors.json || test -s packages/pca/conformance/k3-vectors.json
          test -s conformance/fresh-at-vectors.json || test -s packages/pca/conformance/fresh-at-vectors.json
          python -m pytest -q test_k3_vectors.py test_fresh_at_vectors.py
      - name: Agent / issuer side (producer vectors byte for byte; round trips through the verifiers; ML-DSA hybrids)
        shell: bash
        env:
          PCA_REQUIRE_PQ: ${{ runner.os == 'Linux' && '1' || '0' }} # the `pq` extra (dilithium-py) is installed above; SLH-DSA signing is tested where OpenSSL >= 3.5 is present
          PCA_PRODUCER_OUT: ${{ runner.temp }}/producer-native-python.json
        run: |
          test -s conformance/producer-vectors.json || test -s packages/pca/conformance/producer-vectors.json
          python -m pytest -q test_agent_producer.py
          [ "$PCA_REQUIRE_PQ" != 1 ] || test -s "$PCA_PRODUCER_OUT"  # written where post-quantum signing is required
      - name: Upload this SDK's signed artifacts for the reference verifier
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13' }}
        uses: actions/upload-artifact@v4
        with:
          name: producer-native-python
          path: ${{ runner.temp }}/producer-native-python.json
          if-no-files-found: error
      - name: pca_grant authorization-details type (shared pca-grant-vectors.json; a missing file fails, never skips)
        run: |
          test -s conformance/pca-grant-vectors.json || test -s packages/pca/conformance/pca-grant-vectors.json
          test -s conformance/blueprint-vectors.json || test -s packages/pca/conformance/blueprint-vectors.json
          test -s conformance/k4-vectors.json || test -s packages/pca/conformance/k4-vectors.json
          test -s conformance/a2a-vectors.json || test -s packages/pca/conformance/a2a-vectors.json
          python -m pytest -q test_pca_grant_vectors.py test_blueprint_vectors.py test_a2a_vectors.py test_k4_vectors.py
          test -s conformance/workflow-vectors.json || test -s packages/pca/conformance/workflow-vectors.json
          test -s conformance/readside-vectors.json || test -s packages/pca/conformance/readside-vectors.json
          python -m pytest -q test_pca_grant_vectors.py test_blueprint_vectors.py test_a2a_vectors.py test_k5_vectors.py
      - name: K5 vault, aggregate reads and workflow admission inside authorize (shared vault-aggregate-vectors.json and authorize-workflow-fixtures.json; a missing file fails, never skips)
        run: |
          test -s conformance/vault-aggregate-vectors.json || test -s packages/pca/conformance/vault-aggregate-vectors.json
          test -s conformance/authorize-workflow-fixtures.json || test -s packages/pca/conformance/authorize-workflow-fixtures.json
          python -m pytest -q test_k5_read_vault.py test_k5_authorize_workflow.py test_k5_middleware_workflow.py
          test -s conformance/lease-vectors.json || test -s packages/pca/conformance/lease-vectors.json
          test -s conformance/obligations-vectors.json || test -s packages/pca/conformance/obligations-vectors.json
          test -s conformance/break-glass-vectors.json || test -s packages/pca/conformance/break-glass-vectors.json
          test -s conformance/missing-context-vectors.json || test -s packages/pca/conformance/missing-context-vectors.json
          test -s conformance/policy-classes-vectors.json || test -s packages/pca/conformance/policy-classes-vectors.json
          python -m pytest -q test_pca_grant_vectors.py test_blueprint_vectors.py test_a2a_vectors.py test_lease_vectors.py test_obligations_vectors.py test_break_glass_vectors.py test_missing_context_vectors.py test_policy_classes_vectors.py test_policy_link.py
          python -m pytest -q test_pca_grant_vectors.py test_blueprint_vectors.py test_a2a_vectors.py
      - name: Build provenance gates (shared provenance-vectors.json; a missing file fails, never skips)
        run: |
          test -s conformance/provenance-vectors.json || test -s packages/pca/conformance/provenance-vectors.json
          python -m pytest -q test_provenance_vectors.py
      - name: Provenance by default and undo windows (shared arg-provenance-vectors.json and undo-vectors.json; a missing file fails, never skips)
        env:
          PCA_REQUIRE_PQ: ${{ runner.os == 'Linux' && '1' || '0' }} # the hybrid ML-DSA receipt test must run where the pq extra is installed
        run: |
          test -s conformance/arg-provenance-vectors.json || test -s packages/pca/conformance/arg-provenance-vectors.json
          test -s conformance/undo-vectors.json || test -s packages/pca/conformance/undo-vectors.json
          python -m pytest -q test_arg_provenance_vectors.py test_mutation_kill_arg_provenance.py test_undo_vectors.py test_mutation_kill_undo.py test_provenance_flow.py
      - name: Offline Sigstore bundle verification (shared sigstore-vectors.json; the sigstore extra)
        run: |
          test -s conformance/sigstore-vectors.json || test -s packages/pca/conformance/sigstore-vectors.json
          python -m pip install 'cryptography>=42'
          python -m unittest -v test_sigstore_vectors
      # test_ref_sandbox_wasm.py needs wasmtime-py and the pinned reference host: the sandbox-wasm workflow runs it
      - name: Unit tests
        run: python -m pytest -q -n auto --dist loadfile --timeout=900 --timeout-method=thread --durations=20 --ignore=packages --ignore=test_ref_sandbox_wasm.py
      # mutmut runs any subset of the tests in its own order: the pins must hold alone too, or a mutant would be 'killed' by
      # state an earlier test left behind
      - name: Whole-output pins on their own (test_base_pinned.py)
        if: always()
        run: python -m pytest -q --durations=30 test_base_pinned.py
      - name: Extension-layer vectors (optimistic path and transparency ledger), on their own
        run: python -m pytest -q test_ext_vectors.py
      - name: Every test file is collected (a test file that pytest does not pick up fails the job)
        shell: bash
        run: |
          python -m pytest --collect-only -q --ignore=packages --ignore=test_ref_sandbox_wasm.py | grep -o '^test_[A-Za-z0-9_]*\.py' | sort -u > "$RUNNER_TEMP/collected.txt"
          # files whose module needs a native library built only by their own workflow (pairing, fhe, fndsa, lwe-ot, mpc) or OpenSSL >= 3.5 signing (the 3.9 runner has 3.0) skip here at module level and run there
          ls test_*.py | grep -v -E '^(test_ref_sandbox_wasm|test_aggsig_kat|test_bbs_kat|test_fame_pyecc|test_fhe_seal|test_ref_abe|test_ref_aggsig|test_ref_bbs|test_ref_fndsa_native|test_ref_mpc_endemic|test_ref_mpc_pq|test_ref_pq_threshold_extra)\.py$' | sort > "$RUNNER_TEMP/all.txt"
          missing=$(comm -23 "$RUNNER_TEMP/all.txt" "$RUNNER_TEMP/collected.txt")  # a file not collected here; extra collected files are fine
          [ -z "$missing" ] || { echo "not collected:"; echo "$missing"; exit 1; }
      # the vendor attestation verifiers (AMD SEV-SNP, Intel TDX, Azure MAA, Google Confidential Space, NVIDIA GPU) and the strict
      # X.509 readers replay packages/pca/conformance/attestation-evidence-vectors.json (fetched above with the flagship corpus), and
      # verify_passport replays the passport_hardware_vectors table of passport-vectors.json. Both are produced by the TypeScript
      # reference (the pca repository's CI checks they are current): a missing file or table FAILS, it never skips, and here the
      # `cryptography` package is required (PCA_REQUIRE_ATTEST), where the dependency-free job below skips the crypto-backed tests.
      # Already part of the step above: run on their own so a regression in the verifiers is visible as its own step.
      - name: Attestation verifiers (vendor vectors, strict DER, fail-closed tables)
        env:
          PCA_REQUIRE_ATTEST: '1'
        run: python -m pytest -q test_attestation_vectors.py test_attest_units.py test_passport_conformance.py test_allowlist_anchor_conformance.py
      - name: Mesh trust verifier (whole cross-domain proofs, reason and hop per vector)
        run: python -m pytest -q test_mesh.py
      - name: Goal binding v3 (approved_goal commitments, invalid digests, binding rules)
        run: python -m pytest -q test_goal_commit_v3.py
      - name: Revocation staleness (age cap, per-class windows, signed epoch, gate, authorize wiring)
        run: python -m pytest -q test_revocation_staleness.py
      - name: Operation records (at-most-once execution, recovery, executor, concurrency, durable store)
        run: python -m pytest -q test_operations.py
      - name: Plan lifecycle (draft to revoked, Merkle root, check, concurrency, durable store, authorize wiring)
        run: python -m pytest -q test_plan_lifecycle.py
      - name: Assurance labels (signature level, report, requirement gate, multi-root level)
        run: python -m pytest -q test_assurance_vectors.py test_assurance.py
      - name: Step-up client (device key against the RFC 8032 vectors, approve / deny against a fake transport)
        run: python -m pytest -q test_stepup.py
      - name: Store conformance helper (passes the shipped stores, fails racy and non-durable ones)
        run: python -m pytest -q test_store_conformance.py
      - name: Parity close-out (chain compaction, discovery, receipts, approvals, threshold verifier, FGA for RAG, assurance hooks, LESS signing, MCP audience override and defs import)
        run: python -m pytest -q test_parity_close.py test_ref_mcp.py
      - name: Agent-native surface (caution, rationale, tool-schema firewall, envelope introspection, leases; shared reference corpus, a missing file fails)
        run: |
          test -s testdata/ref-agent-native.json.gz
          python -m pytest -q test_ref_agent_native.py
      - name: Entropy (QRNG sources over an injected transport, health tests, HKDF combiner, secure seed; shared reference corpus, a missing file fails)
        run: |
          test -s testdata/ref-entropy.json.gz
          python -m pytest -q test_ref_entropy.py
      - name: Prohibitions, contracts, the Policy VM decide / derive and the mesh issuing side (shared reference corpora; a missing file fails)
        run: |
          test -s testdata/ref-prohibitions.json.gz
          test -s testdata/ref-contracts.json.gz
          test -s testdata/ref-decide-java.json.gz
          test -s testdata/ref-decide-derive.json.gz
          test -s testdata/ref-mesh-issue.json.gz
          test -s testdata/ref-pq-threshold-quorum.json.gz
          test -s testdata/ref-safety-certificate.json.gz
          python -m pytest -q test_ref_prohibitions_contracts.py test_ref_decide.py test_ref_mesh_issue.py test_ref_pq_quorum.py test_ref_safety_certificate.py
      - name: Product and intent modules (shared reference corpora; a missing file fails)
        run: |
          test -s testdata/ref-intent-attest.json.gz
          test -s testdata/ref-catalog.json.gz
          test -s testdata/ref-budget-forecast.json.gz
          test -s testdata/ref-reputation.json.gz
          test -s testdata/ref-core-research-java.json.gz
          test -s testdata/ref-policy-debug.json.gz
          test -s testdata/ref-ha.json.gz
          test -s testdata/ref-taint.json.gz
          test -s testdata/ref-frontier-signals.json.gz
          test -s testdata/ref-core-sweep-java.json.gz
          test -s testdata/ref-objective-risk.json.gz
          test -s testdata/ref-progress.json.gz
          test -s testdata/ref-attestation-soft.json.gz
          test -s testdata/ref-connectors-providers.json.gz
          test -s testdata/ref-sevsnp-helpers.json.gz
          test -s testdata/ref-attest-pq-software.json.gz
          test -s testdata/ref-attest-allowlist.json.gz
          test -s testdata/ref-beacons.json.gz
          test -s testdata/ref-action-pin.json.gz
          test -s testdata/ref-semantic-threshold.json.gz
          test -s testdata/ref-attest-puf.json.gz
          test -s testdata/ref-attest-maa.json.gz
          test -s testdata/ref-attest-nvidia.json.gz
          test -s testdata/ref-attest-nvidia-rim.json.gz
          test -s testdata/ref-passport.json.gz
          test -s testdata/ref-action-schema.json.gz
          test -s testdata/ref-action-schema-draft.json.gz
          test -s testdata/ref-intent-misc2.json.gz
          test -s testdata/ref-nl-approval.json.gz
          test -s testdata/ref-intent-routing.json.gz
          test -s testdata/ref-frost-net.json.gz
          test -s testdata/ref-frost-dkg.json.gz
          test -s testdata/ref-core-small-surface.json.gz
          test -s test-data/ref-control-blue.json.gz
          test -s testdata/ref-attest-vendors.json.gz
          test -s testdata/ref-verify-verdict.json.gz
          python -m pytest -q test_ref_intent_attest.py test_ref_catalog.py test_ref_budget_forecast.py test_ref_reputation.py test_ref_core_research.py test_ref_policy_debug.py test_ref_ha.py test_ref_taint.py test_ref_frontier_signals.py test_ref_core_sweep.py test_ref_objective_risk.py test_ref_progress.py test_ref_attestation_soft.py test_ref_connectors_providers.py test_ref_sevsnp_helpers.py test_ref_attest_pq_software.py test_ref_attest_allowlist.py test_ref_beacons.py test_ref_action_pin.py test_ref_semantic_threshold.py test_ref_attest_puf.py test_ref_attest_maa.py test_ref_attest_nvidia.py test_ref_passport.py test_ref_action_schema.py test_ref_intent_misc2.py test_ref_nl_approval.py test_ref_objective_binding.py test_base_actionschema_diff.py test_ref_intent_schema.py test_ref_policy_ci_extra.py test_corpus_pins.py test_ref_intent_routing.py test_ref_frost_net.py test_ref_frost_dkg.py test_ref_core_small_surface.py test_ref_control_blue.py test_frost_dkg_tls.py test_ref_attest_vendors.py test_ref_verify_verdict.py
      - name: Wire schemas with the structural validator, and session histories (shared reference corpora, every case; a missing file fails)
        run: |
          test -s test-data/ref-schema.json.gz
          test -s testdata/base-intenthistory.json.gz
          python -m pytest -q test_ref_schema.py test_base_intenthistory_diff.py test_bond_settlement.py
      - name: ZK compliance, pure parts (envelope gate, pins, quantisation, statements, ceremony; the pairing cases run in the zk workflow)
        run: |
          test -s testdata/ref-zk.json.gz
          python -m pytest -q test_ref_zk.py test_verifier_hooks.py
      - name: Mesh witness and domain, FGA for RAG, goal benchmark, undo coordinator (shared reference corpora; a missing file fails, never skips)
        run: |
          test -s test-data/ref-core-mesh-domain-java.json.gz
          test -s test-data/ref-core-mesh-proof-java.json.gz
          test -s test-data/ref-core-stores-java.json.gz
          test -s test-data/ref-rag.json.gz
          test -s test-data/ref-goal-bench.json.gz
          test -s test-data/ref-durable-state.json.gz
          python -m pytest -q test_ref_core_mesh.py test_ref_core_stores.py test_ref_rag.py test_ref_goal_bench.py test_undo_coordinator.py test_bond_settlement.py test_pca_surface.py test_ref_durable_state.py test_rule22_engine.py test_create_sandbox.py test_audit_stragglers.py test_sibling_ports.py

  verifier-dep-free:
    # the base package declares no dependencies: the pure-Python fallbacks must pass on their own
    name: verifier (no optional dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Full adversarial corpus from the flagship
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh $([ "$RUNNER_OS" = Windows ] || echo --less)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RSA DPoP oracle corpus (generated, never committed)
        shell: bash
        run: .github/scripts/dpop-rsa-corpus.sh "$PWD/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated, never committed)
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$PWD/test-data" oprf:oprf core-frost-java:core-frost-java mpc-ot:mpc-ot attest-eat:attest-eat abe:abe frost-dkg:frost-dkg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - run: python -m pip install pytest pytest-xdist "pysodium>=0.7.19,<0.8" "tzdata>=2024.1" "pyuca>=1.2"
      - name: Conformance corpus (pure-Python Ed25519; PQ suites fail closed)
        run: python test_conformance.py
      - name: Unit tests
        run: python -m pytest -q -n auto --dist loadfile --ignore=packages --ignore=test_ref_sandbox_wasm.py

  build:
    name: build sdists + wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Build every distribution
        run: |
          python -m build --outdir dist .
          for p in packages/*/; do python -m build --outdir dist "$p"; done
          ls -l dist

  example-fastapi:
    # the runnable example server (examples/fastapi-server): installs the package from this checkout and runs its smoke script
    name: example fastapi-server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[fastapi,fast]" httpx  # the smoke script signs: signing needs `cryptography`
      - name: Smoke (allow, refusal with a doc link, unauthenticated)
        working-directory: examples/fastapi-server
        run: python smoke.py

  adapters:
    name: adapter ${{ matrix.fw }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fw: [agent-framework, crewai, fastmcp, google-adk, haystack, langgraph, pydantic-ai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-asyncio
      - name: Duck-typed suite (no framework installed)
        working-directory: packages/${{ matrix.fw }}
        run: python -m pytest -q --ignore-glob='test_real_*'
      - name: Install the pinned framework (test-real extra)
        run: python -m pip install -e . -e "packages/${{ matrix.fw }}[test-real]"
      - name: End-to-end suite against the real framework
        working-directory: packages/${{ matrix.fw }}
        run: python -m pytest -q test_real_*.py

  maturity:
    name: every published package declares its maturity tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # tier in every manifest, a matching "Maturity:" line in every README header, experimental said where it applies
      - run: node .github/scripts/maturity-check.mjs
