[project]
name = "atlas-pca"
version = "0.4.2"
description = "Reference verifier for Atlas Proof-Carrying Authority (PCActn core, M0-M3)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atlas" }]
keywords = ["authorization", "agents", "proof-carrying-authority", "pca", "verifier", "ed25519", "ml-dsa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
fast = ["cryptography>=41"]  # optional: native Ed25519; a pure-Python RFC 8032 verifier is the fallback
pq = ["dilithium-py>=1.0"]   # B4 post-quantum: pure-Python ML-DSA-65/87 (FIPS 204). Without it ML-DSA, and always SLH-DSA (FIPS 205), use OpenSSL >= 3.5 libcrypto via ctypes when present (supported_suites() reports what this runtime can verify)
fastapi = ["fastapi>=0.110"] # optional: FastAPI dependency (atlas_pca.fastapi); base stays dep-free
django = ["django>=4.2"]     # optional: Django middleware (atlas_pca.django); base stays dep-free

[project.urls]
Homepage = "https://github.com/Atlas-Authorization/pca-python"
Repository = "https://github.com/Atlas-Authorization/pca-python"
Issues = "https://github.com/Atlas-Authorization/pca-python/issues"
Specification = "https://github.com/Atlas-Authorization/pca"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_pca"]
